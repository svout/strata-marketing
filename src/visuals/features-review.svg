<!-- features-review.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 198" width="420" height="198" fill="none" class="v-root v-features-review" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sample approval notification: Strata · needs your approval, £9,800.00, agt_procure-bot → [Supplier] · over the daily cap, with Approve and Decline buttons.</title>
<style>
.v-root{font-family:var(--font-geist-sans,'Geist'),'Geist',system-ui,sans-serif}
.v-mono{font-family:var(--font-geist-mono,'Geist Mono'),'Geist Mono',ui-monospace,monospace}
.v-a{animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--v-start,0ms) + var(--d,0ms))}
.v-rise{animation-name:v-rise;transform-box:fill-box}
.v-fade{animation-name:v-fade}
.v-pop{animation-name:v-pop;transform-box:fill-box;transform-origin:50% 50%}
.v-grow-y{animation-name:v-grow-y;transform-box:fill-box;transform-origin:50% 100%;animation-duration:.7s}
.v-grow-x{animation-name:v-grow-x;transform-box:fill-box;transform-origin:0 50%;animation-duration:.9s}
.v-typing{opacity:0;animation-name:v-typing;animation-timing-function:linear}
.v-dot{animation:v-dot 1s ease-in-out infinite}
@keyframes v-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-fade{from{opacity:0}to{opacity:1}}
@keyframes v-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes v-grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes v-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes v-typing{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes v-dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.visual-paused .v-a,.visual-paused .v-dot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.v-a,.v-dot{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="419" height="197" rx="16" fill="#141518" stroke="rgba(255,255,255,0.08)"/>
<g class="v-a v-fade" style="--d:0ms;"><rect x="22" y="22" width="22" height="22" rx="6" fill="#2B59FF"/>
<g transform="translate(25.5 25.5) scale(0.31)" fill="#FFFFFF"><rect x="18" y="7" width="24" height="9" rx="4.5"/><rect x="12" y="19.5" width="24" height="9" rx="4.5"/><rect x="6" y="32" width="24" height="9" rx="4.5"/></g>
<text x="54" y="33" dominant-baseline="central" font-size="14" fill="#F7F8F8" font-weight="500">Strata · needs your approval</text><text x="398" y="33" dominant-baseline="central" font-size="12" fill="#7C8089" text-anchor="end">now</text></g>
<g class="v-a v-rise" style="--d:120ms;"><text x="22" y="75" dominant-baseline="central" font-size="26" fill="#F7F8F8" class="v-mono">£9,800.00</text></g>
<g class="v-a v-rise" style="--d:200ms;"><text x="22" y="116" dominant-baseline="central" font-size="13" fill="#8A8F98">agt_procure-bot → [Supplier] · over the daily cap</text></g>
<g class="v-a v-pop" style="--d:320ms;"><rect x="22" y="140" width="82.57" height="36" rx="8" fill="#2B59FF"/><text x="38" y="158" dominant-baseline="central" font-size="13" fill="#FFFFFF" font-weight="500">Approve</text><rect x="112.57" y="140" width="77.87" height="36" rx="8" fill="#1C1D21" stroke="#2A2C31"/><text x="128.57" y="158" dominant-baseline="central" font-size="13" fill="#F7F8F8" font-weight="500">Decline</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
