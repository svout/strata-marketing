<text x="68" y="32" dominant-baseline="central" font-size="14" fill="#F7F8F8">Test mode on</text><text x="398" y="32" dominant-baseline="central" font-size="12" fill="#8A8F98" text-anchor="end" class="v-mono">sk_test_••••3f9a</text></g>
