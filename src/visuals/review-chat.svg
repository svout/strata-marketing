<rect x="24" y="366" width="105.31" height="30" rx="8" stroke="#2A2C31"/><text x="36" y="381" dominant-baseline="central" font-size="13" fill="#8A8F98">Approve once</text><rect x="137.31" y="366" width="182.04" height="30" rx="8" stroke="#2A2C31"/><text x="149.31" y="381" dominant-baseline="central" font-size="13" fill="#8A8F98">Raise daily cap to £10,000</text><rect x="327.35" y="366" width="187.43" height="30" rx="8" stroke="#2A2C31"/><text x="339.35" y="381" dominant-baseline="central" font-size="13" fill="#8A8F98">Always ask for this supplier</text><rect x="24.5" y="408.5" width="1071" height="47" rx="14" fill="#141518" stroke="#2A2C31"/><text x="40" y="432" dominant-baseline="central" font-size="14" fill="#7C8089">Reply, or ask why this payment was flagged…</text><rect x="1056" y="416" width="32" height="32" rx="8" fill="#2B59FF"/><svg x="1064" y="424" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>
