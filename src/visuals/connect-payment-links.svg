<!-- connect-payment-links.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 292" width="420" height="292" fill="none" class="v-root v-connect-payment-links" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sample Payment links card: [Supplier] deposit, £500.00 · known payee, Approved; Event tickets, £1,200.00 · over the limit, Review; Unknown sender, Domain doesn&#x27;t match, Blocked.</title>
<style>
.v-root{font-family:var(--font-geist-sans,'Geist'),'Geist',system-ui,sans-serif}
.v-mono{font-family:var(--font-geist-mono,'Geist Mono'),'Geist Mono',ui-monospace,monospace}
.v-a{animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--v-start,0ms) + var(--d,0ms))}
.v-rise{animation-name:v-rise;transform-box:fill-box}
.v-fade{animation-name:v-fade}
.v-pop{animation-name:v-pop;transform-box:fill-box;transform-origin:50% 50%}
.v-grow-y{animation-name:v-grow-y;transform-box:fill-box;transform-origin:50% 100%;animation-duration:.7s}
.v-grow-x{animation-name:v-grow-x;transform-box:fill-box;transform-origin:0 50%;animation-duration:.9s}
.v-typing{opacity:0;animation-name:v-typing;animation-timing-function:linear}
.v-dot{animation:v-dot 1s ease-in-out infinite}
@keyframes v-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-fade{from{opacity:0}to{opacity:1}}
@keyframes v-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes v-grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes v-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes v-typing{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes v-dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.visual-paused .v-a,.visual-paused .v-dot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.v-a,.v-dot{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="419" height="291" rx="14" fill="#141518" stroke="#1F2125"/>
<g class="v-a v-fade" style="--d:0ms;"><text x="20" y="30" dominant-baseline="central" font-size="15" fill="#F7F8F8" font-weight="600">Payment links</text><text x="400" y="30" dominant-baseline="central" font-size="11" fill="#7C8089" text-anchor="end" class="v-mono">Sample data</text><text x="20" y="54" dominant-baseline="central" font-size="12" fill="#7C8089">Received by agents</text></g>
<g class="v-a v-rise" style="--d:120ms;"><rect x="20" y="68" width="380" height="52" rx="8" fill="rgba(28,29,33,0.6)"/><svg x="30" y="86" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><text x="58" y="86" dominant-baseline="central" font-size="14" fill="#F7F8F8">[Supplier] deposit</text><text x="58" y="104" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">£500.00 · known payee</text>
<g><rect x="308.14" y="83" width="81.86" height="22" rx="6" fill="rgba(86,182,131,0.14)"/><circle cx="319.14" cy="94" r="3" fill="#56B683"/><text x="328.14" y="94" dominant-baseline="central" font-size="12" fill="#56B683" font-weight="500">Approved</text></g>
</g>
<g class="v-a v-rise" style="--d:200ms;"><svg x="30" y="142" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><text x="58" y="142" dominant-baseline="central" font-size="14" fill="#F7F8F8">Event tickets</text><text x="58" y="160" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">£1,200.00 · over the limit</text>
<g><rect x="321.31" y="139" width="68.69" height="22" rx="6" fill="rgba(255,204,0,0.12)"/><circle cx="332.31" cy="150" r="3" fill="#FFCC00"/><text x="341.31" y="150" dominant-baseline="central" font-size="12" fill="#FFCC00" font-weight="500">Review</text></g>
</g>
<g class="v-a v-rise" style="--d:280ms;"><rect x="20" y="180" width="380" height="52" rx="8" fill="rgba(28,29,33,0.6)"/><svg x="30" y="198" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg><text x="58" y="198" dominant-baseline="central" font-size="14" fill="#F7F8F8">Unknown sender</text><text x="58" y="216" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">Domain doesn&#x27;t match</text>
<g><rect x="316.31" y="195" width="73.69" height="22" rx="6" fill="rgba(241,129,105,0.14)"/><circle cx="327.31" cy="206" r="3" fill="#F18169"/><text x="336.31" y="206" dominant-baseline="central" font-size="12" fill="#F18169" font-weight="500">Blocked</text></g>
</g>
<g class="v-a v-rise" style="--d:360ms;"><svg x="30" y="246" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><text x="58" y="254" dominant-baseline="central" font-size="14" fill="#8A8F98">See all links</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
