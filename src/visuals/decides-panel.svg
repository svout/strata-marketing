<!-- decides-panel.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 624" width="680" height="624" fill="none" class="v-root v-decides-panel" xmlns:c2pa="http://c2pa.org/manifest">
