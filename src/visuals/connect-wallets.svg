<!-- connect-wallets.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 292" width="420" height="292" fill="none" class="v-root v-connect-wallets" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sample Wallet limits card: Per transfer, Up to £250, On; Per day, Up to £1,000, On; Unknown address, Not on the allow list, Blocked.</title>
<style>
.v-root{font-family:var(--font-geist-sans,'Geist'),'Geist',system-ui,sans-serif}
.v-mono{font-family:var(--font-geist-mono,'Geist Mono'),'Geist Mono',ui-monospace,monospace}
.v-a{animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--v-start,0ms) + var(--d,0ms))}
.v-rise{animation-name:v-rise;transform-box:fill-box}
.v-fade{animation-name:v-fade}
.v-pop{animation-name:v-pop;transform-box:fill-box;transform-origin:50% 50%}
.v-grow-y{animation-name:v-grow-y;transform-box:fill-box;transform-origin:50% 100%;animation-duration:.7s}
.v-grow-x{animation-name:v-grow-x;transform-box:fill-box;transform-origin:0 50%;animation-duration:.9s}
.v-typing{opacity:0;animation-name:v-typing;animation-timing-function:linear}
.v-dot{animation:v-dot 1s ease-in-out infinite}
@keyframes v-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-fade{from{opacity:0}to{opacity:1}}
@keyframes v-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes v-grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes v-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes v-typing{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes v-dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.visual-paused .v-a,.visual-paused .v-dot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.v-a,.v-dot{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="419" height="291" rx="14" fill="#141518" stroke="#1F2125"/>
<g class="v-a v-fade" style="--d:0ms;"><text x="20" y="30" dominant-baseline="central" font-size="15" fill="#F7F8F8" font-weight="600">Wallet limits</text><text x="400" y="30" dominant-baseline="central" font-size="11" fill="#7C8089" text-anchor="end" class="v-mono">Sample data</text><text x="20" y="54" dominant-baseline="central" font-size="12" fill="#7C8089">agt_ops wallet</text></g>
<g class="v-a v-rise" style="--d:120ms;"><rect x="20" y="68" width="380" height="52" rx="8" fill="rgba(28,29,33,0.6)"/><svg x="30" y="86" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 10h18M6 6V4h12v2"/></svg><text x="58" y="86" dominant-baseline="central" font-size="14" fill="#F7F8F8">Per transfer</text><text x="58" y="104" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">Up to £250</text>
<g><rect x="345.9" y="83" width="44.1" height="22" rx="6" fill="rgba(43,89,255,0.2)"/><circle cx="356.9" cy="94" r="3" fill="#A1BBFF"/><text x="365.9" y="94" dominant-baseline="central" font-size="12" fill="#A1BBFF" font-weight="500">On</text></g>
</g>
<g class="v-a v-rise" style="--d:200ms;"><svg x="30" y="142" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><text x="58" y="142" dominant-baseline="central" font-size="14" fill="#F7F8F8">Per day</text><text x="58" y="160" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">Up to £1,000</text>
<g><rect x="345.9" y="139" width="44.1" height="22" rx="6" fill="rgba(43,89,255,0.2)"/><circle cx="356.9" cy="150" r="3" fill="#A1BBFF"/><text x="365.9" y="150" dominant-baseline="central" font-size="12" fill="#A1BBFF" font-weight="500">On</text></g>
</g>
<g class="v-a v-rise" style="--d:280ms;"><rect x="20" y="180" width="380" height="52" rx="8" fill="rgba(28,29,33,0.6)"/><svg x="30" y="198" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><text x="58" y="198" dominant-baseline="central" font-size="14" fill="#F7F8F8">Unknown address</text><text x="58" y="216" dominant-baseline="central" font-size="11.5" fill="#8A8F98" class="v-mono">Not on the allow list</text>
<g><rect x="316.31" y="195" width="73.69" height="22" rx="6" fill="rgba(241,129,105,0.14)"/><circle cx="327.31" cy="206" r="3" fill="#F18169"/><text x="336.31" y="206" dominant-baseline="central" font-size="12" fill="#F18169" font-weight="500">Blocked</text></g>
</g>
<g class="v-a v-rise" style="--d:360ms;"><svg x="30" y="246" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#8A8F98" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><text x="58" y="254" dominant-baseline="central" font-size="14" fill="#8A8F98">Add a limit</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
