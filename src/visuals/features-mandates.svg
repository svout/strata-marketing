<!-- features-mandates.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" fill="none" class="v-root v-features-mandates" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sample mandate for agt_travel-booker: Flights, Hotels, Rail; Per payment £800, Per day £2,000, Review over £500; Used today £498.</title>
<style>
.v-root{font-family:var(--font-geist-sans,'Geist'),'Geist',system-ui,sans-serif}
.v-mono{font-family:var(--font-geist-mono,'Geist Mono'),'Geist Mono',ui-monospace,monospace}
.v-a{animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--v-start,0ms) + var(--d,0ms))}
.v-rise{animation-name:v-rise;transform-box:fill-box}
.v-fade{animation-name:v-fade}
.v-pop{animation-name:v-pop;transform-box:fill-box;transform-origin:50% 50%}
.v-grow-y{animation-name:v-grow-y;transform-box:fill-box;transform-origin:50% 100%;animation-duration:.7s}
.v-grow-x{animation-name:v-grow-x;transform-box:fill-box;transform-origin:0 50%;animation-duration:.9s}
.v-typing{opacity:0;animation-name:v-typing;animation-timing-function:linear}
.v-dot{animation:v-dot 1s ease-in-out infinite}
@keyframes v-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-fade{from{opacity:0}to{opacity:1}}
@keyframes v-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes v-grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes v-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes v-typing{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes v-dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.visual-paused .v-a,.visual-paused .v-dot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.v-a,.v-dot{animation:none!important}}
</style>
<rect x="0.5" y="0.5" width="419" height="209" rx="16" fill="#141518" stroke="rgba(255,255,255,0.08)"/>
<g class="v-a v-fade" style="--d:0ms;"><text x="22" y="33" dominant-baseline="central" font-size="13" fill="#F7F8F8" class="v-mono">agt_travel-booker</text>
<g><rect x="334.55" y="22" width="63.45" height="22" rx="6" fill="rgba(86,182,131,0.14)"/><circle cx="345.55" cy="33" r="3" fill="#56B683"/><text x="354.55" y="33" dominant-baseline="central" font-size="12" fill="#56B683" font-weight="500">Active</text></g>
</g>
<g class="v-a v-rise" style="--d:100ms;"><rect x="22" y="58" width="60.03" height="28" rx="7" fill="#1C1D21"/><text x="32" y="72" dominant-baseline="central" font-size="13" fill="#F7F8F8">Flights</text><rect x="88.03" y="58" width="58.47" height="28" rx="7" fill="#1C1D21"/><text x="98.03" y="72" dominant-baseline="central" font-size="13" fill="#F7F8F8">Hotels</text><rect x="152.49" y="58" width="42.25" height="28" rx="7" fill="#1C1D21"/><text x="162.49" y="72" dominant-baseline="central" font-size="13" fill="#F7F8F8">Rail</text></g>
<g class="v-a v-rise" style="--d:180ms;"><rect x="22" y="100" width="120" height="58" rx="10" fill="#0E0F11"/><text x="34" y="118" dominant-baseline="central" font-size="12" fill="#7C8089">Per payment</text><text x="34" y="139" dominant-baseline="central" font-size="15" fill="#F7F8F8" class="v-mono">£800</text></g>
<g class="v-a v-rise" style="--d:250ms;"><rect x="150" y="100" width="120" height="58" rx="10" fill="#0E0F11"/><text x="162" y="118" dominant-baseline="central" font-size="12" fill="#7C8089">Per day</text><text x="162" y="139" dominant-baseline="central" font-size="15" fill="#F7F8F8" class="v-mono">£2,000</text></g>
<g class="v-a v-rise" style="--d:320ms;"><rect x="278" y="100" width="120" height="58" rx="10" fill="#0E0F11"/><text x="290" y="118" dominant-baseline="central" font-size="12" fill="#7C8089">Review over</text><text x="290" y="139" dominant-baseline="central" font-size="15" fill="#F7F8F8" class="v-mono">£500</text></g>
<g class="v-a v-fade" style="--d:400ms;"><text x="22" y="181" dominant-baseline="central" font-size="12" fill="#8A8F98">Used today</text><rect x="94.13" y="178" width="265.07" height="6" rx="3" fill="#1C1D21"/>
<g class="v-a v-grow-x" style="--d:480ms"><rect x="94.13" y="178" width="66.27" height="6" rx="3" fill="#2B59FF"/></g>
<text x="398" y="181" dominant-baseline="central" font-size="12" fill="#F7F8F8" text-anchor="end" class="v-mono">£498</text></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
