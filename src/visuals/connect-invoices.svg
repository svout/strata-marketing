<g class="v-a v-fade" style="--d:0ms;"><text x="20" y="30" dominant-baseline="central" font-size="15" fill="#F7F8F8" font-weight="600">Invoice checks</text><text x="400" y="30" dominant-baseline="central" font-size="11" fill="#7C8089" text-anchor="end" class="v-mono">Sample data</text><text x="20" y="54" dominant-baseline="central" font-size="12" fill="#7C8089">Today</text></g>
