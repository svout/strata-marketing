<!-- review-chat-mobile.svg · Strata website visual. Text is live (Geist via the page, or Geist if installed).
     Animations are CSS in <style>; they wait while the page marks the visual .visual-paused
     and switch off for prefers-reduced-motion (the final frame is the static design). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 542" width="360" height="542" fill="none" class="v-root v-review-chat-mobile" xmlns:c2pa="http://c2pa.org/manifest">
<title>Sample Strata Review chat. Strata: agt_procure-bot wants to pay £9,800.00 to [Supplier]; Over the £5,000 daily cap; About 3× this agent’s usual size. Reply: Approve once. Strata: Approved by [name] at 14:04. Paid and recorded as #1043.</title>
<style>
.v-root{font-family:var(--font-geist-sans,'Geist'),'Geist',system-ui,sans-serif}
.v-mono{font-family:var(--font-geist-mono,'Geist Mono'),'Geist Mono',ui-monospace,monospace}
.v-a{animation-duration:.55s;animation-timing-function:cubic-bezier(.2,.7,.2,1);animation-fill-mode:both;animation-delay:calc(var(--v-start,0ms) + var(--d,0ms))}
.v-rise{animation-name:v-rise;transform-box:fill-box}
.v-fade{animation-name:v-fade}
.v-pop{animation-name:v-pop;transform-box:fill-box;transform-origin:50% 50%}
.v-grow-y{animation-name:v-grow-y;transform-box:fill-box;transform-origin:50% 100%;animation-duration:.7s}
.v-grow-x{animation-name:v-grow-x;transform-box:fill-box;transform-origin:0 50%;animation-duration:.9s}
.v-typing{opacity:0;animation-name:v-typing;animation-timing-function:linear}
.v-dot{animation:v-dot 1s ease-in-out infinite}
@keyframes v-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes v-fade{from{opacity:0}to{opacity:1}}
@keyframes v-pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes v-grow-y{from{transform:scaleY(0)}to{transform:none}}
@keyframes v-grow-x{from{transform:scaleX(0)}to{transform:none}}
@keyframes v-typing{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes v-dot{0%,60%,100%{opacity:.35}30%{opacity:1}}
.visual-paused .v-a,.visual-paused .v-dot{animation-play-state:paused}
@media (prefers-reduced-motion:reduce){.v-a,.v-dot{animation:none!important}}
</style>
