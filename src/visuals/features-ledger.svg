<g class="v-a v-rise" style="--d:320ms;"><path d="M22 124.5H398" stroke="#1F2125"/><text x="22" y="141" dominant-baseline="central" font-size="12" fill="#A1BBFF" class="v-mono">#1040</text><text x="88" y="141" dominant-baseline="central" font-size="12.5" fill="#F7F8F8">mandate.updated · [name]</text><text x="398" y="141" dominant-baseline="central" font-size="11" fill="#7C8089" text-anchor="end" class="v-mono">7e2c…04</text></g>
<g class="v-a v-pop" style="--d:520ms;"><rect x="22" y="172" width="376" height="40" rx="10" fill="rgba(86,182,131,0.1)"/><svg x="34" y="184" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#56B683" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg><text x="60" y="192" dominant-baseline="central" font-size="13" fill="#56B683">Chain verified · every hash matches</text></g>
