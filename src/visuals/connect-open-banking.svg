<g><rect x="321.31" y="195" width="68.69" height="22" rx="6" fill="rgba(255,204,0,0.12)"/><circle cx="332.31" cy="206" r="3" fill="#FFCC00"/><text x="341.31" y="206" dominant-baseline="central" font-size="12" fill="#FFCC00" font-weight="500">Review</text></g>
</g>
